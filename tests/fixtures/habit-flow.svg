<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A proposed habit loop</title><desc id="desc">Choose one action, try it in daily life, and reflect on what helped. This is an illustrative concept, not a completed study.</desc><rect width="1200" height="675" fill="#eff2d7"/><g font-family="Arial,sans-serif" fill="#263a26"><text x="55" y="80" font-size="18" letter-spacing="3">A SMALL LOOP TO EXPLORE</text><text x="55" y="148" font-size="46" font-weight="700">Make the next attempt a little easier.</text><path d="M125 360H1050" stroke="#93a67b" stroke-width="2"/><g fill="#fffdf5"><rect x="50" y="225" width="345" height="280" rx="20"/><rect x="425" y="225" width="345" height="280" rx="20"/><rect x="800" y="225" width="345" height="280" rx="20"/></g><g fill="#54713b" font-size="22"><text x="80" y="275">01</text><text x="455" y="275">02</text><text x="830" y="275">03</text></g><g font-size="30" font-weight="600"><text x="80" y="335">Choose one action</text><text x="455" y="335">Try it in daily life</text><text x="830" y="335">Reflect on</text><text x="830" y="375">what helped</text></g><g font-size="21" fill="#57624f"><text x="80" y="393">Make the first step</text><text x="80" y="425">specific and small.</text><text x="455" y="393">Notice when it is easy</text><text x="455" y="425">or difficult to start.</text><text x="830" y="425">Adjust the next attempt.</text></g><text x="55" y="608" font-size="18" fill="#637056">ILLUSTRATIVE DEVELOPMENT CONCEPT · NO TESTING OR OUTCOMES CLAIMED</text></g></svg>
